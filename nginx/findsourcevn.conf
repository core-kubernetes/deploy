# Findsource — reverse proxy (1 file)
# Install: sudo bash deploy/nginx/install.sh
# SSL:
#   sudo certbot --nginx -d findsourcevn.com -d www.findsourcevn.com
#   sudo certbot --nginx -d be.findsourcevn.com
#   sudo certbot --nginx -d admin.findsourcevn.com

upstream findsource_api {
    server 127.0.0.1:7003;
    keepalive 32;
}

upstream findsource_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream findsource_admin {
    server 127.0.0.1:5173;
    keepalive 16;
}

# --- API: be.findsourcevn.com → port 7003 ---
server {
    listen 80;
    listen [::]:80;
    server_name be.findsourcevn.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://findsource_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- Web: findsourcevn.com → port 3000 ---
server {
    listen 80;
    listen [::]:80;
    server_name www.findsourcevn.com;

    return 301 http://findsourcevn.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name findsourcevn.com;

    location / {
        proxy_pass http://findsource_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin: admin.findsourcevn.com → port 5173 ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.findsourcevn.com;

    location / {
        proxy_pass http://findsource_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
