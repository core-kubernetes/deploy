# Deploy giai đoạn 1: MySQL + API + Ingress (chưa web/admin)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: findsource

resources:
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      $patch: delete
  - target:
      version: v1
      kind: Service
      name: web
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: web
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: admin
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: admin
      $patch: delete
  - target:
      version: v1
      kind: Service
      name: admin
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: admin
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: findsource-api
    newName: ghcr.io/phamtuankhoi/findsource-api
    newTag: production
