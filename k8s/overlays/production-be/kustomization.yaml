# Deploy giai đoạn 1: MySQL + API + Ingress (chưa web/admin)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: findsource

resources:
  - ../../base

# Kustomize v5: không reference file ../../base/*.yaml trực tiếp — dùng base/ rồi xóa web/admin
patches:
  - path: delete-web-admin.yaml
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: findsource-api
    newName: ghcr.io/phamtuankhoi/findsource-api
    newTag: production
