apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: findsource

resources:
  - ../../base
  - ../../base/cert-manager/cluster-issuer.yaml

# Sửa org GitHub trước khi deploy
images:
  - name: findsource-api
    newName: ghcr.io/YOUR_GITHUB_ORG/findsource-api
    newTag: production
  - name: findsource-web
    newName: ghcr.io/YOUR_GITHUB_ORG/findsource-web
    newTag: production
  - name: findsource-admin
    newName: ghcr.io/YOUR_GITHUB_ORG/findsource-admin
    newTag: production

patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
